name: Pawsweep

# Builds Pawsweep, the Mac app in mac/. A pawsweep-v* tag also publishes the
# zipped app as a GitHub release. (Mole's own releases use V* tags.)
on:
  push:
    branches: [main]
    tags: ['pawsweep-v*']
    paths: ['mac/**', '.github/workflows/pawsweep.yml']
  pull_request:
    paths: ['mac/**', '.github/workflows/pawsweep.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # The Intel runner builds the same universal app. GitHub's Apple silicon
    # runners dropped the release job twice for lack of capacity (2026-11-18).
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the build number is the commit count

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Use Xcode 26 (SwiftTerm needs Swift 6.2)
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2> /dev/null | sort -V | tail -1)"
          if [[ -n "$xcode" ]]; then sudo xcode-select -s "$xcode"; fi
          swift --version

      - name: Test
        run: swift test --package-path mac

      - name: Build
        run: mac/scripts/build-app.sh

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/pawsweep-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < mac/VERSION)"
          if [[ "$GITHUB_REF_NAME" != "pawsweep-v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match mac/VERSION ($version)." >&2
            exit 1
          fi
          mole_version="$(sed -n 's/^VERSION="\(.*\)"$/\1/p' mole | head -1)"
          cat > notes.md << EOF
          Pawsweep $version, a Mac window for Mole $mole_version with mouse support.

          **Install:** download \`Pawsweep-$version.zip\`, unzip it, and move Pawsweep to Applications.
          Pawsweep is not signed with an Apple Developer ID, so the first time macOS blocks it:
          open **System Settings → Privacy & Security** and click **Open Anyway** next to Pawsweep.
          Needs macOS 13 or newer, on Apple silicon or Intel.

          See [mac/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/mac/README.md) for how to use it.
          Pawsweep is a community project, not affiliated with or endorsed by Mole.
          EOF
          sed -i '' 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" "mac/dist/Pawsweep-$version.zip" \
            --title "Pawsweep $version" --notes-file notes.md
