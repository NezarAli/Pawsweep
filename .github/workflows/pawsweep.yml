name: Pawsweep

# Builds Pawsweep, the Mac app in mac/. On main it publishes a release whenever mac/VERSION
# names a version that has none yet, so releasing is: bump mac/VERSION and push.
#
# Once a day it also looks for a new Mole release (V* tags of tw93/Mole). When there is one, it
# merges it, bumps mac/VERSION, tests and builds the app, and only then pushes to main and
# publishes the release. Pushing Mole's own workflow changes needs the SYNC_TOKEN secret
# (mac/README.md, "Mole updates"). Anything that fails stops the run before main changes, and
# GitHub emails you about the failed run.
on:
  push:
    branches: [main]
    paths: ['mac/**', '.github/workflows/pawsweep.yml']
  pull_request:
    paths: ['mac/**', '.github/workflows/pawsweep.yml']
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pawsweep-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mole:
    name: Look for a new Mole release
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: check
        run: |
          release="$(mac/scripts/mole-release.sh check)"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Newest Mole release not in Pawsweep yet: ${release:-none}"

  build:
    needs: mole
    # A scheduled run builds only when there is a Mole release to merge.
    if: ${{ !cancelled() && needs.mole.result != 'failure' && (github.event_name != 'schedule' || needs.mole.outputs.release != '') }}
    # The Intel runner builds the same universal app. GitHub's Apple silicon
    # runners dropped the release job twice for lack of capacity (2026-11-18).
    runs-on: macos-15-intel
    env:
      MOLE_RELEASE: ${{ needs.mole.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the build number is the commit count
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Use Xcode 26 (SwiftTerm needs Swift 6.2)
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2> /dev/null | sort -V | tail -1)"
          if [[ -n "$xcode" ]]; then sudo xcode-select -s "$xcode"; fi
          swift --version

      - name: Merge Mole ${{ env.MOLE_RELEASE }}
        if: env.MOLE_RELEASE != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mac/scripts/mole-release.sh merge
          git log --oneline -3

      - name: Test
        run: swift test --package-path mac

      - name: Build
        run: mac/scripts/build-app.sh

      - name: Push the merge to main
        if: env.MOLE_RELEASE != ''
        env:
          TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          if ! git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main; then
            echo "::error::Could not push Mole $MOLE_RELEASE to main. If the message above says the token lacks the workflows permission, add the SYNC_TOKEN secret (mac/README.md, \"Mole updates\"). If main moved, the next run tries again."
            exit 1
          fi

      - name: Publish the release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(tr -d '[:space:]' < mac/VERSION)"
          tag="pawsweep-v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Pawsweep $version is already released."
            exit 0
          fi
          mole_version="$(sed -n 's/^VERSION="\(.*\)"$/\1/p' mole | head -1)"
          previous="$(git tag --list 'pawsweep-v*' --sort=-v:refname | head -1)"
          {
            echo "Pawsweep $version, a minimal Mac interface for Mole $mole_version."
            echo
            echo "- Mole $mole_version: [what's new in Mole](https://github.com/tw93/Mole/releases/tag/V$mole_version)"
            if [[ -n "$previous" ]]; then
              git log --format='- %s' "$previous..HEAD" -- mac ':(exclude)mac/VERSION'
            fi
            echo
            echo "**Install:** download \`Pawsweep-$version.zip\`, unzip it, and move Pawsweep to Applications."
            echo "Pawsweep is not signed with an Apple Developer ID, so the first time macOS blocks it:"
            echo "open **System Settings → Privacy & Security** and click **Open Anyway** next to Pawsweep."
            echo "Needs macOS 13 or newer, on Apple silicon or Intel."
            echo
            echo "Pawsweep is a community project, not affiliated with or endorsed by Mole."
          } > notes.md
          cat notes.md
          gh release create "$tag" "mac/dist/Pawsweep-$version.zip" \
            --target "$(git rev-parse HEAD)" --title "Pawsweep $version" --notes-file notes.md
